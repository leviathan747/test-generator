title: "Unit 1A Test FRQ: Polynomial Functions"
author: Levi Starrett
class_name: AP Precalculus
class_id: APPC
duration: 15 min
sections: 1.1 - 1.6
question_count: 1
questions:
  - id: 3341d22a-c222-4038-a8d4-499523bfe993
    related_to:
      - 9d2e9127-44ed-4b0d-b0f5-0e195c8b7d9e
    question: |
      The function $f$ is given by
      \[
        f(x) = -0.008x^5 + 0.277x^3 - 0.259x^2 - 1.523x - 0.506
      \]
    parts:
      - question: |
          Identify all relative extrema of $f$. Give your answers as ordered
          pairs labeled as "maximum" or "minimum".
        solution: |
          Use calculator to graph and find extrema with \emph{maximum} and
          \emph{minimum} tools.
          \begin{gather*}
            (-4.6692, -9.4844) \qquad \text{minimum} \\
            (-1.1029, 0.5001) \qquad \text{maximum} \\
            (1.9185, -2.6331) \qquad \text{minimum} \\
            (3.8536, -1.1680) \qquad \text{maximum} \\
          \end{gather*}
          \emph{Note: answers are incorrect if not given correctly to three
          decimal places, and $0.5$ points are deducted if any extra extrema
          are given.}
        grading:
          - points: 0.5
            criterion: '$(-4.6692, -9.4844)$ minimum'
          - points: 0.5
            criterion: '$(-1.1029, 0.5001)$ maximum'
          - points: 0.5
            criterion: '$(1.9185, -2.6331)$ minimum'
          - points: 0.5
            criterion: '$(3.8536, -1.1680)$ maximum'
        sections:
          - 1.4
        dok: 2
        work_space: 2in
      - question: |
          Find all real zeros of $f$.
        solution: |
          Use calculator to graph and find zeros with \emph{zero} tool.
          \begin{gather*}
            x = -5.9127 \\
            x = -1.7581 \\
            x = -0.3633 \\
          \end{gather*}
          \emph{Note: answers are incorrect if not given correctly to three
          decimal places, and $0.5$ points are deducted if any extra zeros are
          given.}
        grading:
          - points: 1
            criterion: $x = -5.9127$
          - points: 1
            criterion: $x = -1.7581$
          - points: 1
            criterion: $x = -0.3633$
        sections:
          - 1.5
        dok: 2
        work_space: 1.5in
      - question: |
          What is the maximum number of non-real zeros possible for the
          function $f$? Give a reason for your answer.
        solution: |
          The number of zeros must be equal to the degree of the polynomial
          function. $f$ has degree 5 and 3 real zeros. Therefore, there are a
          maximum of 2 non-real zeros.
        grading:
          - points: 1
            criterion: Answer
          - points: 1
            criterion: Reason using Fundamental Theorem of Algebra
        sections:
          - 1.5
        dok: 3
        work_space: 1.5in
    calculator_active: true
    question_type: FRQ

  - id: 9d2e9127-44ed-4b0d-b0f5-0e195c8b7d9e
    related_to:
      - 3341d22a-c222-4038-a8d4-499523bfe993
    question: |
      The function $f$ is given by
      \[
        f(x) = 0.2x^5 - 1.48x^4 - 0.732x^3 + 15.484x^2 - 0.416x + 8.112
      \]
    parts:
      - question: |
          Identify all relative extrema of $f$. Give your answers as ordered
          pairs labeled as "maximum" or "minimum".
        solution: |
          Use calculator to graph and find extrema with \emph{maximum} and
          \emph{minimum} tools.
          \begin{gather*}
            (-2.1113, 47.1025) \qquad \text{maximum} \\
            (0.0134, 8.1092) \qquad \text{minimum} \\
            (2.8178, 55.7298) \qquad \text{maximum} \\
            (5.2, 0) \qquad \text{minimum} \\
          \end{gather*}
          \emph{Note: answers are incorrect if not given correctly to three
          decimal places, and $0.5$ points are deducted if any extra extrema
          are given.}
        grading:
          - points: 0.5
            criterion: '$(-2.1113, 47.1025)$ maximum'
          - points: 0.5
            criterion: '$(0.0134, 8.1092)$ minimum'
          - points: 0.5
            criterion: '$(2.8178, 55.7298)$ maximum'
          - points: 0.5
            criterion: '$(5.2, 0)$ minimum'
        sections:
          - 1.4
        dok: 2
        work_space: 2in
      - question: |
          Find all real zeros of $f$.
        solution: |
          Use calculator to graph and find zeros with \emph{zero} tool.
          \begin{gather*}
            x = -3 \\
            x = 5.2 \\
          \end{gather*}
          \emph{Note: answers are incorrect if not given correctly to three
          decimal places, and $0.5$ points are deducted if any extra zeros are
          given.}
        grading:
          - points: 1
            criterion: $x = -3$
          - points: 1
            criterion: $x = 5.2$
        sections:
          - 1.5
        dok: 2
        work_space: 1.5in
      - question: |
          What is the maximum number of non-real zeros possible for the
          function $f$? Give a reason for your answer.
        solution: |
          The number of zeros must be equal to the degree of the polynomial
          function. $f$ has degree 5. The graph has a minimum at $(5.2, 0)$,
          so $x = 5.2$ is a repeated zero and 3 of the zeros are real.
          Therefore, there are a maximum of 2 non-real zeros.
        grading:
          - points: 1
            criterion: Answer
          - points: 1
            criterion: Reason using Fundamental Theorem of Algebra
        sections:
          - 1.5
        dok: 3
        work_space: 1.5in
    calculator_active: true
    question_type: FRQ
