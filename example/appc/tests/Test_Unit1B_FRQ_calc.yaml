  - id: 823c0a21-5698-45b4-b998-677002f29cd1
    related_to:
      - aa8d95f8-70c1-48bb-941f-b8a969ab6589
    question: |
      A fisheries biologist measures the length and mass of 16 trout caught in
      a lake. The following data was collected where $L$ is the length of the
      fish in centimeters and $m$ is the mass of the fish in grams.

      \begin{center}
        \footnotesize
        \begin{tabularx}{7in}{ |*{2}{Y|}|*{2}{Y|}|*{2}{Y|}|*{2}{Y|} }
          \hline
          \rowcolor{lightgray}
          \bm{$L$} (cm) & \bm{$m$} (g) & \bm{$L$} (cm) & \bm{$m$} (g) & \bm{$L$} (cm) & \bm{$m$} (g) & \bm{$L$} (cm) & \bm{$m$} (g) \\
          \hline
          12 &  20.8 & 22 & 127.0 & 30 & 328.8 & 38 &  667.4 \\
          15 &  41.6 & 24 & 164.1 & 32 & 378.7 & 40 &  765.9 \\
          18 &  71.7 & 26 & 213.3 & 34 & 486.4 & 44 & 1014.5 \\
          20 &  95.0 & 28 & 263.1 & 36 & 558.8 & 48 & 1339.4 \\
          \hline
        \end{tabularx}
      \end{center}
    parts:
      - question: |
          What type of model is most appropriate for these data? Give an
          equation for your model. Justify your response with specific
          characteristics from the data.
        solution: |
          A cubic model fits the data best. The curve appears to match the
          data well and the residual plot is evenly distributed around the
          $L$-axis with no discernible pattern.

          $m(L) = 0.01268596511L^3 - 0.05227691338L^2 + 1.254658635L - 8.96404222$
        grading:
          - points: 1
            criterion: Correct model
          - points: 1
            criterion: Correct equation
          - points: 1
            criterion: Justification
        sections:
          - 1.13
          - 1.14
        dok: 3
        work_space: 2in
      - question: |
          What is the average length of a fish in the study? What does the
          model predict the mass of a fish of this length to be?
        solution: |
          Average length $\Rightarrow 29.1875$ cm

          $m(29.1875) = 298.5592$ grams
        grading:
          - points: 1
            criterion: Correct length
          - points: 1
            criterion: Correct mass
        sections:
          - 1.14
        dok: 2
        work_space: 1.5in
      - question: |
          A young trout in the lake is 5 centimeters long. Would it be
          appropriate to use the model to predict the mass of this fish? Give a
          reason for your answer.
        solution: |
          No. The model predicts $m(5) = -2.4119$ grams, but a fish cannot have
          a negative mass. A length of 5 cm is outside the range of lengths in
          the data (12 cm to 48 cm), so the model should not be used for it.
        grading:
          - points: 1
            criterion: No, with a reason
        sections:
          - 1.14
        dok: 3
        work_space: 1.5in
