      - The least possible degree of $g$ is three.
      - The least possible degree of $g$ is five.
    solution: |
      \hspace{1.7in}
      \begin{tabularx}{4.7in}{ *{5}{Y} }
        $-3 - (-6) = \bm{3}$ & $1 - (-3) = \bm{4}$ & $4 - 1 = \bm{3}$ & $5 - 4 = \bm{1}$ & $4 - 5 = \bm{-1}$ \\
      \end{tabularx}

      \hspace{2.1in}
      \begin{tabularx}{3.7in}{ *{4}{Y} }
        $4 - 3 = \bm{1}$ & $3 - 4 = \bm{-1}$ & $1 - 3 = \bm{-2}$ & $-1 - 1 = \bm{-2}$ \\
      \end{tabularx}

      \hspace{2.3in}
      \begin{tabularx}{3.1in}{ *{3}{Y} }
        $-1 - 1 = \bm{-2}$ & $-2 - (-1) = \bm{-1}$ & $-2 - (-2) = \bm{0}$ \\
      \end{tabularx}

      \hspace{2.8in}
      \begin{tabularx}{2.3in}{ *{2}{Y} }
        $-1 - (-2) = \bm{1}$ & $0 - (-1) = \bm{1}$ \\
      \end{tabularx}
