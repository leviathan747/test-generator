  - id: 45d1c01a-d91e-4883-96ab-3ba40f07705a
    related_to:
      - 3a60e2fc-7cde-4543-b441-2c01b77d46d1
    question: |
      Answer the following questions.
    parts:
      - question: |
          The function $g$ is given by $g(x) = x^4 - 7x^3 + 3x^2 - 21x$. Find
          all values of $x$ for which $g(x) = 0$.
        solution: |
          \begin{align*}
            0 &= x^4 - 7x^3 + 3x^2 - 21x \\
              &= x(x^3 - 7x^2 + 3x - 21) \\
              &= x \left[ x^2(x - 7) + 3(x - 7) \right] \\
              &= x(x^2 + 3)(x - 7) \\
            x &= 0, \quad x = 7 \\
          \end{align*}
          \emph{Note: $x^2 + 3$ has no real zeros.}
        grading:
          - points: 1
            criterion: $x = 0$
          - points: 1
            criterion: $x = 7$
        sections:
          - 1.5
        dok: 2
        work_space: 2in
      - question: |
          On the coordinate axes below, sketch a graph of a polynomial function
