      The function $P(V)$ models the pressure of a gas in a vessel and is given
      by $P(V) = \frac{nRT}{V}$ for $V \ge 0$, where $V$ is measured in liters
      (L), $P$ is measured in pascal (Pa), and $n$, $R$, and $T$ are constants.
      Which of the following statements describes the pressure in the vessel as
      the volume increases?
    answer: The pressure decreases and approaches a value of 0 Pa.
    distractors:
      - The pressure decreases without bound.
      - The pressure increases and approaches a value of $nRT$ Pa.
      - The pressure increases at a rate proportional to $nRT$ Pa/L.
    solution: |
