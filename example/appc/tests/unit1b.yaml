    question: |
      The average cost, in dollars per item, for a company to produce $n$
      items is modeled by $C(n) = \frac{500 + 2n}{n}$ for $n > 0$. Which of the
      following describes the average cost as the number of items increases?
    answer: The average cost decreases and approaches \$2 per item.
    distractors:
      - The average cost decreases and approaches \$0 per item.
      - The average cost decreases and approaches \$500 per item.
      - The average cost increases without bound.
    solution: |
      $C(n) = \frac{500}{n} + 2$. As $n$ increases, $\frac{500}{n}$ decreases
      and approaches 0. The degrees of the numerator and denominator are
      equal, so the horizontal asymptote is the ratio of the leading
      coefficients, $\frac{2}{1} = 2$.
