    question: |
      A ball is thrown upward. A quadratic function $h$ models the height of
      the ball, in meters, $t$ seconds after it is thrown. The ball reaches a
      maximum height of 30 meters at $t = 2$ seconds, and $h(0) = 10$. Which of
      the following is $h(t)$?
    answer: $h(t) = -5(t - 2)^2 + 30$
    distractors:
      - $h(t) = -5(t + 2)^2 + 30$
      - $h(t) = -10(t - 2)^2 + 30$
      - $h(t) = 5(t - 2)^2 + 30$
    solution: |
      The maximum at $(2, 30)$ is the vertex, so $h(t) = a(t - 2)^2 + 30$.
      Then $h(0) = 4a + 30 = 10$, so $a = -5$.
