question_count: 1
questions:
  - id: b06e0e68-1ddf-444a-b944-aaed9f70f532
    related_to:
      - e1b2748e-cae2-43af-878c-80cbe97b1ec0
    question: |
      \begin{center}
        \begin{tabularx}{4in}{ |Y||*{3}{Y|} }
          \hline
          \bm{$n$} & 2 & 4 & 5 \\
          \hline
          \bm{$f_n$} & 3 & $k$ & 24 \\
          \hline
        \end{tabularx}
      \end{center}

      The table above presents values for a sequence $f$ at selected values of
      $n$, where $k$ is a constant. The data in the table can be used to find two
      possible models for $f_n$ -- an arithmetic model $a_n$ or a geometric model
      $g_n$.
    parts:
      - question: |
          The arithmetic model $a_n$ for $f_n$ can be written as $a_n$ = $a_0 +
          dn$, where $d$ is the common difference between successive terms. Use the
          data in the table to find an expression for $a_n$ in terms of $n$ and use
          the model to find the value of the constant $k$ in the table above.
        solution: |
          \begin{multicols}{2}
            \begin{gather*}
              24 = 3 + d(5 - 2) \\
              24 = 3 + 3d \\
              21 = 3d \\
              d = 7 \\
              3 = a_0 + 7(2) \\
              3 = a_0 + 14  \\
              a_0 = -11  \\
              \boxed{ a_n = -11 + 7n } \\
            \end{gather*}

            \begin{gather*}
              k = -11 + 7(4) \\
              k = -11 + 28 \\
              \boxed{ k = 17 } \\
            \end{gather*}
          \end{multicols}
        grading:
          - points: 1
            criterion: Expression for $a_n$
          - points: 1
            criterion: Value of $k$
        sections:
          - 2.1
        dok: 2
        work_space: 2in
      - question: |
          According to the arithmetic model, for what value of $n$ will $f_n = 66$?
        solution: |
          \begin{gather*}
            66 = -11 + 7n \\
            77 = 7n \\
            \boxed{ n = 11 } \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Value of $n$
        sections:
          - 2.1
        dok: 2
        work_space: 1.5in
      - question: |
          The geometric model $g_n$ for $f_n$ can be written as $g_n$ = $g_0 \cdot
          r^n$, where $r$ is the common ratio between successive terms. Use the
          data in the table to find an expression for $g_n$ in terms of $n$ and use
          the model to find the value of the constant $k$ in the table above.
        solution: |
          \begin{multicols}{2}
            \begin{gather*}
              24 = 3 \cdot r^{5 - 2} \\
              24 = 3 \cdot r^3 \\
              8 = r^3 \\
              r = 2 \\
              3 = g_0 \cdot 2^2 \\
              3 = g_0 \cdot 4  \\
              g_0 = \frac{3}{4}  \\
              \boxed{ g_n = \frac{3}{4} \cdot 2^n } \\
            \end{gather*}

            \begin{gather*}
              k = \frac{3}{4} \cdot 2^4 \\
              k = \frac{3}{4} \cdot 16 \\
              \boxed{ k = 12 } \\
            \end{gather*}
          \end{multicols}
        grading:
          - points: 1
            criterion: Expression for $g_n$
          - points: 1
            criterion: Value of $k$
        sections:
          - 2.1
        dok: 2
        work_space: 2in
      - question: |
          For $n \ge 0$, the value of $f_{n + 1} - f_n$ increases as $n$ increases.
          Based on this, is $a_n$ or $g_n$ a better model for $f_n$?  Give a reason
          for your answer.
        solution: |
          Because the difference between successive elements is increasing, the
          geometric sequence $g_n$ is a better model. For arithmetic sequences,
          the difference between successive elements is a constant value (the
          common difference).
        grading:
          - points: 1
            criterion: Answer with reason
        sections:
          - 2.1
        dok: 3
        work_space: 1.5in
    calculator_active: false
    question_type: FRQ
    review: generated

