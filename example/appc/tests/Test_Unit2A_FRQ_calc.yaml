  - id: 85139be6-cd3e-49f3-9c6b-a99d1a66488a
    related_to:
      - 1163b003-ea5e-4d84-b24d-e578eb337554
    question: |
      \begin{center}
        \footnotesize
        \begin{tabularx}{7in}{ |Y||*{8}{Y|} }
          \hline
          \bm{$t$} (hours) & 0 & 1 & 2 & 3 & 4 & 5 & 6 & 7 \\
          \hline
          \bm{$N(t)$} & 1.2 & 1.7 & 2.1 & 3.0 & 3.9 & 5.5 & 7.1 & 9.8 \\
          \hline
        \end{tabularx}
      \end{center}

      A biologist grows a colony of bacteria in a laboratory. Selected values
      of $N(t)$ are given in the table above where $N$ represents the number
      of bacteria in the colony, in thousands, and $t$ represents the number
      of hours since the biologist began observing the colony.

      $N(t)$ can be modeled by the exponential regression $y =
      1.2106(1.346626)^t$, where $t$ is the number of hours since the
      biologist began observing the colony.
    parts:
      - question: |
          At what time $t$ does the regression model predict that $N(t) = 8$?
        solution: |
          Enter the regression equation into your calculator. Find the
          intersection between the regression curve and the constant function $y
          = 8$.

          $t \approx 6.345$ hours after the biologist began observing the colony
        grading:
          - points: 2
            criterion: Value of $t$
        sections:
          - 2.5
        dok: 2
        work_space: 1.5in
      - question: |
          Find the residual value of the number of bacteria in the colony when
          $t = 6$. Does this residual value indicate that our model
          overestimated or underestimated the number of bacteria in the colony
          when $t = 6$? Give a reason for your answer.
        solution: |
          residual = actual - predicted
          residual $= 7.1 - 7.219 \approx -0.119$

          The model overestimated the number of bacteria when $t = 6$. This can
          be seen because the residual value is negative.
        grading:
          - points: 1
            criterion: Value of the residual
          - points: 1
            criterion: Over/underestimate with reason
        sections:
          - 2.6
        dok: 2
        work_space: 1.5in
      - question: |
          The function $N(t)$ can also be modeled with a linear model. Let $y = a +
          bx$ be the linear regression model for $N(t)$. Use the data in the table
          to find the linear regression model and use the model to predict the
          value of $N(4.5)$.
        solution: |
          $y = 0.1916666667 + 1.170238095x$

          $N(4.5) \approx 5.458$ thousand bacteria
        grading:
          - points: 1
            criterion: Regression equation
          - points: 1
            criterion: Value of $N(4.5)$
        sections:
          - 2.6
        dok: 2
        work_space: 1.5in
      - question: |
          According to the exponential regression model, by what percent does
          the number of bacteria in the colony increase each hour? Give a reason
          for your answer.
        solution: |
          The base of the exponential model, $1.346626$, is the growth factor
          for each one-hour increase in $t$. Each hour the colony has
          $134.6626\%$ of the bacteria it had the hour before, so the number of
          bacteria increases by $1.346626 - 1 = 0.346626$, or about
          $34.663\%$, each hour.
        grading:
          - points: 1
            criterion: Percent increase with reason
        sections:
          - 2.5
        dok: 2
        work_space: 1.5in
    calculator_active: true
    question_type: FRQ
    review: generated
