  - id: 1163b003-ea5e-4d84-b24d-e578eb337554
    related_to:
      - 85139be6-cd3e-49f3-9c6b-a99d1a66488a
    question: |
      \begin{center}
        \footnotesize
        \begin{tabularx}{7in}{ |Y||*{9}{Y|} }
          \hline
          \bm{$t$} (years) & 0 & 1 & 2 & 3 & 4 & 5 & 6 & 7 & 8 \\
          \hline
          \bm{$V(t)$} & 31.5 & 27.9 & 23.1 & 19.6 & 17.2 & 14.1 & 12.3 & 10.2 & 8.9 \\
          \hline
        \end{tabularx}
      \end{center}

      A used-car dealer tracks the resale value of a certain model of car.
      Selected values of $V(t)$ are given in the table above where $V$
      represents the value of the car in thousands of dollars and $t$
      represents the number of years since the car was purchased new.

      $V(t)$ can be modeled by the exponential regression $y =
      32.0357(0.851231)^t$, where $t$ is the number of years since the car
      was purchased new.
    parts:
      - question: |
          At what time $t$ does the regression model predict that $V(t) = 12$?
        solution: |
          Enter the regression equation into your calculator. Find the
          intersection between the regression curve and the constant function $y
          = 12$.

          $t \approx 6.096$ years after the car was purchased new
        grading:
          - points: 2
            criterion: Value of $t$
        sections:
          - 2.5
        dok: 2
        work_space: 1.5in
      - question: |
          Find the residual value of the car when $t = 4$. Does this residual
          value indicate that our model overestimated or underestimated the
          value of the car when $t = 4$? Give a reason for your answer.
        solution: |
          residual = actual - predicted
          residual $= 17.2 - 16.820 \approx 0.380$

          The model underestimated the value of the car when $t = 4$. This can
          be seen because the residual value is positive.
        grading:
          - points: 1
            criterion: Value of the residual
          - points: 1
            criterion: Over/underestimate with reason
        sections:
          - 2.6
        dok: 2
        work_space: 1.5in
      - question: |
          The function $V(t)$ can also be modeled with a linear model. Let $y = a +
          bx$ be the linear regression model for $V(t)$. Use the data in the table
          to find the linear regression model and use the model to predict the
          value of $V(6.5)$.
        solution: |
          $y = 29.68444444 - 2.843333333x$

          $V(6.5) \approx 11.203$ thousand dollars
        grading:
          - points: 1
            criterion: Regression equation
          - points: 1
            criterion: Value of $V(6.5)$
        sections:
          - 2.6
        dok: 2
        work_space: 1.5in
      - question: |
          According to the exponential regression model, by what percent does
          the value of the car decrease each year? Give a reason for your
          answer.
        solution: |
          The base of the exponential model, $0.851231$, is the growth factor
          for each one-year increase in $t$. Each year the car keeps
          $85.1231\%$ of its value from the year before, so its value decreases
          by $1 - 0.851231 = 0.148769$, or about $14.877\%$, each year.
        grading:
          - points: 1
            criterion: Percent decrease with reason
        sections:
          - 2.5
        dok: 2
        work_space: 1.5in
    calculator_active: true
