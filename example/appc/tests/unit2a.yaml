  - id: 863c6495-99ae-4617-a909-2b7fc5921d38
    legacy_ids:
      - 2A.A.5
    related_to:
      - bcc88acb-8ba2-4126-a6c1-603635175b70
    question: |
      Let $m(x) = 5 \left( \frac{2}{3} \right)^{x - 1}$. Which of the following
      statements about $m$ is correct?
    answer: $m$ is decreasing and the graph of $m$ is concave up.
    distractors:
      - $m$ is increasing and the graph of $m$ is concave up.
      - $m$ is increasing and the graph of $m$ is concave down.
      - $m$ is decreasing and the graph of $m$ is concave down.
    solution: |
      $m(x) = 5\left(\frac{2}{3}\right)^{x-1} = \frac{15}{2}\left(\frac{2}{3}\right)^x$,
      so $a = \frac{15}{2} \qquad b = \frac{2}{3}$ \\
      Because $0 < b < 1$, this curve represents exponential decay. Because $a
      > 0$, $m$ will be positive on its entire domain, therefore it is
      decreasing and concave up.
    calculator_active: false
    sections:
      - 2.3
    dok: 2
    review: generated

  - id: 88eee4da-1d0a-46f3-b201-01f3de7b05fa
    legacy_ids:
      - 2A.A.6
    related_to:
      - 7d5c5d2b-12b1-4836-b315-8fa3a4e196bc
    question: |
      Let $f$ be an exponential function with the following end behavior:
      \[
        \lim_{x \to -\infty} f(x) = \infty \qquad \text{and} \qquad \lim_{x \to \infty} f(x) = 0
      \]
      Which of the following could be the graph of $f$?
    answer: \resizebox{2in}{!}{\input{figures/50.tex}}
    distractors:
      - \resizebox{2in}{!}{\input{figures/47.tex}}
      - \resizebox{2in}{!}{\input{figures/49.tex}}
      - \resizebox{2in}{!}{\input{figures/48.tex}}
    solution: |
      As $x \to -\infty$, $f(x)$ increases without bound, and as $x \to \infty$,
      $f(x)$ approaches 0. This matches $f(x) = ab^x$ with $a > 0$ and
      $0 < b < 1$: always decreasing and concave up. The graph with a relative
      minimum and a relative maximum has the same end behavior, but an
      exponential function is always increasing or always decreasing, so it
      can't have extrema.
    calculator_active: false
    sections:
      - 2.3
    dok: 2
    review: generated

