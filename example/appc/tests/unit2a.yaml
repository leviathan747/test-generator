    question: |
      Let $m(x) = -2 \left( \frac{1}{2} \right)^{x + 2}$. Which of the following
      statements about $m$ is correct?
    answer: $m$ is increasing and the graph of $m$ is concave down.
    distractors:
      - $m$ is increasing and the graph of $m$ is concave up.
      - $m$ is decreasing and the graph of $m$ is concave up.
      - $m$ is decreasing and the graph of $m$ is concave down.
    solution: |
      $m(x) = -2\left(\frac{1}{2}\right)^{x+2} = -\frac{1}{2}\left(\frac{1}{2}\right)^x$,
      so $a = -\frac{1}{2}$ and $b = \frac{1}{2}$. Because $0 < b < 1$,
      $\left(\frac{1}{2}\right)^x$ is decreasing and concave up. Multiplying by
      $a < 0$ reflects the graph over the $x$-axis, so $m$ is increasing and
      concave down.
    calculator_active: false
    sections:
      - 2.3
    dok: 2
    review: generated

