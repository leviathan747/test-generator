            criterion: Correct factoring of $r$
          - points: 0.5
            criterion: $x = -4$
          - points: 0.5
            criterion: $x = 2$
        sections:
          - 1.9
        dok: 2
        work_space: 2in
      - question: |
          Find all real zeros of $r$, or state that no real zeros exist.
        solution: |
          Zero at $x = -3$ \quad (hole at $x = -2$)

          \emph{Note: $0.5$ points are deducted if the hole is included.}
        grading:
          - points: 1
            criterion: Correct zero
        sections:
          - 1.8
        dok: 2
        work_space: 1.5in
