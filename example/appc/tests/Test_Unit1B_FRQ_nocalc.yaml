questions:
  - id: 0253b26a-0543-451d-b034-6549ef479933
    related_to:
      - d4360d97-6911-4e16-87dc-f80d510cbffb
    question: |
      A rational function $r$ is given by
      $r(x) = \frac{2x^3 - 10x^2 - 8x + 40}{x^3 - 2x^2 - 16x + 32}$.
    parts:
      - question: |
          Determine equations for all vertical asymptotes of the graph of $r$,
          or state that no vertical asymptotes exist.
        solution: |
          $r(x) = \frac{2(x - 2)(x + 2)(x - 5)}{(x - 2)(x + 4)(x - 4)}$.

          Vertical asymptotes at $x = -4$ and $x = 4$ \quad (hole at $x = 2$)

          \emph{Note: $0.5$ points are deducted if the hole is included.}

          \emph{If V.A. are not correct, award up to 1 point for correct
          factoring. Do not take points away for incorrect factoring if answer
          is correct.}
        grading:
          - points: 1
            criterion: Correct factoring of $r$
          - points: 0.5
            criterion: $x = -4$
          - points: 0.5
            criterion: $x = 4$
        sections:
          - 1.9
        dok: 2
        work_space: 2in
      - question: |
          Find all real zeros of $r$, or state that no real zeros exist.
        solution: |
          Zeros at $x = -2$ and $x = 5$ \quad (hole at $x = 2$)

          \emph{Note: $0.5$ points are deducted if the hole is included.}
        grading:
          - points: 0.5
            criterion: $x = -2$
          - points: 0.5
            criterion: $x = 5$
        sections:
          - 1.8
        dok: 2
        work_space: 1.5in
      - question: |
          Determine if the graph of $r$ has any horizontal asymptotes or slant
          asymptotes. Write equations for those asymptotes, or state that no
          horizontal asymptotes or slant asymptotes exist. \emph{Give a reason
          for your answer.}
        solution: |
          Horizontal asymptote at $y = 2$ since the degree of the numerator is
          equal to the degree of the denominator and the ratio of the leading
          coefficients is 2. \\
          No slant asymptotes exist.
        grading:
          - points: 1
            criterion: Horizontal asymptote
          - points: 1
            criterion: Reasoning
        sections:
          - 1.7
        dok: 3
        work_space: 2in
      - question: |
          Sketch the graph of $r$ on the axes below. Include all asymptotes,
          intercepts, and holes.
        figure: 41.tex
        figure_placement: below
        figure_width: 4in
        grading:
          - points: 1
            criterion: Correct sketch
        sections:
          - 1.11
        dok: 3
        work_space: 0in
    calculator_active: false
    question_type: FRQ
    review: none

  - id: d4360d97-6911-4e16-87dc-f80d510cbffb
