  - id: 1308ce29-8427-4b48-a324-fbf83c5d7645
    related_to:
      - 48a8e7ab-44f0-4b28-9331-5cec5eb05aeb
    question: |
      A rational function $r$ is given by
      $r(x) = \frac{x^3 - 3x^2 - 4x + 12}{x^2 - x - 2}$.
    parts:
      - question: |
          Determine equations for all vertical asymptotes of the graph of $r$,
          or state that no vertical asymptotes exist.
        solution: |
          $r(x) = \frac{(x - 2)(x + 2)(x - 3)}{(x - 2)(x + 1)}$.

          Vertical asymptote at $x = -1$ \quad (hole at $x = 2$)

          \emph{Note: $0.5$ points are deducted if the hole is included.}

          \emph{If V.A. are not correct, award up to 1 point for correct
          factoring. Do not take points away for incorrect factoring if answer
          is correct.}
        grading:
          - points: 1
            criterion: Correct factoring of $r$
          - points: 1
            criterion: $x = -1$
        sections:
          - 1.9
        dok: 2
        work_space: 2in
      - question: |
          Find all real zeros of $r$, or state that no real zeros exist.
        solution: |
          Zeros at $x = -2$ and $x = 3$ \quad (hole at $x = 2$)

          \emph{Note: $0.5$ points are deducted if the hole is included.}
        grading:
          - points: 0.5
            criterion: $x = -2$
          - points: 0.5
            criterion: $x = 3$
        sections:
          - 1.8
        dok: 2
        work_space: 1.5in
      - question: |
          Determine if the graph of $r$ has any horizontal asymptotes or slant
          asymptotes. Write equations for those asymptotes, or state that no
          horizontal asymptotes or slant asymptotes exist. \emph{Give a reason
          for your answer.}
        solution: |
          Slant asymptote at $y = x - 2$ since the degree of the numerator is
          one more than the degree of the denominator.
          \[
            \frac{x^3 - 3x^2 - 4x + 12}{x^2 - x - 2}
              = x - 2 + \frac{-4x + 8}{x^2 - x - 2}
          \]
          No horizontal asymptotes exist.
        grading:
          - points: 1
            criterion: Slant asymptote $y = x - 2$
          - points: 1
            criterion: Reasoning
        sections:
          - 1.7
        dok: 3
        work_space: 2in
      - question: |
          Sketch the graph of $r$ on the axes below. Include all asymptotes,
          intercepts, and holes.
        figure: 43.tex
        figure_placement: below
        figure_width: 4in
        grading:
          - points: 1
            criterion: Correct sketch
        sections:
          - 1.11
        dok: 3
