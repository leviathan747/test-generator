    question: |
      Answer the following questions.
    parts:
      - question: |
          The function $g$ is given by $g(x) = x^4 + x^2 - 20$. Find all values
          of $x$ for which $g(x) = 0$.
        solution: |
          \begin{align*}
            0 &= x^4 + x^2 - 20 \\
              &= (x^2 - 4)(x^2 + 5) \\
              &= (x - 2)(x + 2)(x^2 + 5) \\
            x &= -2, \quad x = 2 \\
          \end{align*}
          \emph{Note: $x^2 + 5$ has no real zeros.}
        grading:
          - points: 1
            criterion: $x = -2$
          - points: 1
            criterion: $x = 2$
        sections:
