questions:
  - id: f7e31d19-2d5a-4e8c-8db8-ebee30dc2fcf
    legacy_ids:
      - 3.A.11
    question: |
      Let $f$ and $g$ be differentiable functions. Selected values of $f$, $g$,
      and their derivatives are given in the table above.
    figure: 39.tex
    figure_placement: above
    parts:
      - question: |
          If $h(x) = f(g(x))$, find $h'(4)$.
        solution: |
          \begin{gather*}
            h'(x) = f'(g(x)) \cdot g'(x) \\
            h'(4) = f'(g(4)) \cdot g'(4)
            = f'(2) \cdot \frac{1}{4}
            = 12 \cdot \frac{1}{4} = 3 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
        dok: 2
        work_space: 1.5in
      - question: |
          If $j(x) = \frac{x^2}{g(f(x))}$, find $j'(1)$.
        solution: |
          \begin{gather*}
            j'(x) = \frac{g(f(x)) \cdot 2x - x^2 \cdot g'(f(x)) \cdot f'(x)}{\left[ g(f(x)) \right]^2} \\
            j'(1) = \frac{g(f(1)) \cdot 2(1) - (1)^2 \cdot g'(f(1)) \cdot f'(1)}{\left[ g(f(1)) \right]^2} \\
            = \frac{g(1) \cdot 2 - g'(1) \cdot 3}{\left[ g(1) \right]^2} \\
            = \frac{1 \cdot 2 - \frac{1}{2} \cdot 3}{(1)^2} \\
            = 2 - \frac{3}{2} = \frac{1}{2} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Quotient Rule
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.5
        dok: 2
        work_space: 2in
      - question: |
          Find $(f^{-1})'(8)$.
        solution: |
          $(f^{-1})'(8) = \frac{1}{f'(f^{-1}(8))} = \frac{1}{f'(2)} = \frac{1}{12}$
        grading:
          - points: 1
            criterion: Expression for $(f^{-1})'(8)$
          - points: 1
            criterion: Evaluated $f^{-1}(8)$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.3
        dok: 2
        work_space: 1.5in
      - question: |
          Estimate $f'(1.5)$.
        solution: |
          $f'(1.5) \approx \frac{f(2) - f(1)}{2 - 1} = \frac{8 - 1}{1} = 7$

          \emph{Note: for credit, the solution must show the difference quotient}
        grading:
          - points: 1
            criterion: Correct answer
        sections:
          - 2.1
        dok: 1
        work_space: 1in
    calculator_active: false
    question_type: FRQ
    review: none

  - id: ee9b404a-36dd-4159-bc87-0a7ca842dc5f
    legacy_ids:
      - 3.B.11
    question: |
      Let $f$ and $g$ be differentiable functions. Selected values of $f$, $g$,
      and their derivatives are given in the table above.
    figure: 40.tex
    figure_placement: above
    parts:
      - question: |
          If $h(x) = f(g(x))$, find $h'(1)$.
        solution: |
          \begin{gather*}
            h'(x) = f'(g(x)) \cdot g'(x) \\
            h'(1) = f'(g(1)) \cdot g'(1)
            = f'(-5) \cdot 2
            = -\frac{1}{4} \cdot 2 = -\frac{1}{2} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
        dok: 2
        work_space: 1.5in
      - question: |
          If $j(x) = x \cdot g(f(x))$, find $j'(1)$.
        solution: |
          \begin{gather*}
            j'(x) = x \cdot g'(f(x)) \cdot f'(x) + 1 \cdot g(f(x)) \\
            j'(1) = 1 \cdot g'(f(1)) \cdot f'(1) + 1 \cdot g(f(1)) \\
            j'(1) = g'(2) \cdot -4 + g(2) \\
            j'(1) = 4 \cdot -4 + (-2) = -16 - 2 = -18 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Product Rule
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.5
        dok: 2
        work_space: 2in
      - question: |
          Find $(f^{-1})'(2)$.
        solution: |
          $(f^{-1})'(2) = \frac{1}{f'(f^{-1}(2))} = \frac{1}{f'(1)} = -\frac{1}{4}$
        grading:
          - points: 1
            criterion: Expression for $(f^{-1})'(2)$
          - points: 1
            criterion: Evaluated $f^{-1}(2)$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.3
        dok: 2
        work_space: 1.5in
      - question: |
          Estimate $f'(1.5)$.
        solution: |
          $f'(1.5) \approx \frac{f(2) - f(1)}{2 - 1} = \frac{\frac{1}{2} - 2}{1} = -\frac{3}{2}$

          \emph{Note: for credit, the solution must show the difference quotient}
        grading:
          - points: 1
            criterion: Correct answer
        sections:
          - 2.1
        dok: 1
        work_space: 1in
    calculator_active: false
    question_type: FRQ
    review: check

  - id: 495a5752-9cd4-44cf-b28c-563e3c3ebb2a
    question: |
      Consider the curve given by $x^2 + xy + y^2 = 12$.
    parts:
      - question: |
          Show that $\dydx = \frac{-2x - y}{x + 2y}$.
        solution: |
          \begin{gather*}
            2x + \left( x \dydx + y \right) + 2y \dydx = 0 \\
            x \dydx + 2y \dydx = -2x - y \\
            \dydx (x + 2y) = -2x - y \\
            \dydx = \frac{-2x - y}{x + 2y} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Implicit differentiation with Chain Rule
          - points: 1
            criterion: Product Rule on $xy$
          - points: 1
            criterion: Solves for $\dydx$
        sections:
          - 3.1
          - 3.2
        dok: 2
        work_space: 2in
      - question: |
          Write an equation for the line tangent to the curve at the point $(2, 2)$.
        solution: |
          \begin{gather*}
            \left. \dydx \right|_{(2, 2)} = \frac{-2(2) - 2}{2 + 2(2)} = \frac{-6}{6} = -1 \\
            y - 2 = -1(x - 2) \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Slope at $(2, 2)$
          - points: 1
            criterion: Tangent line equation
        sections:
          - 2.2
          - 3.2
        dok: 2
        work_space: 1.5in
      - question: |
          Find the coordinates of each point on the curve at which the line tangent
          to the curve is horizontal.
        solution: |
          Horizontal tangent lines occur where $\textstyle \dydx = 0 \implies -2x - y = 0 \implies y = -2x$ \\
          Substitute into the equation of the curve:
          \begin{gather*}
            x^2 + x(-2x) + (-2x)^2 = 12 \\
            3x^2 = 12 \\
            x = \pm 2 \\
          \end{gather*}
          The points are $(2, -4)$ and $(-2, 4)$. At both points $x + 2y \ne 0$.
        grading:
          - points: 1
            criterion: Sets num. equal to 0
          - points: 1
            criterion: Substitutes into curve equation
          - points: 1
            criterion: Both points
        sections:
          - 3.2
        dok: 3
        work_space: 2.5in
      - question: |
          Find the value of $\frac{d^2y}{dx^2}$ at the point $(2, 2)$.
        solution: |
          \begin{gather*}
            \frac{d^2y}{dx^2} = \frac{(x + 2y)\left(-2 - \dydx\right) - (-2x - y)\left(1 + 2\dydx\right)}{(x + 2y)^2} \\
            \text{At } (2, 2) \text{ with } \dydx = -1: \\
            \frac{d^2y}{dx^2} = \frac{(6)(-2 + 1) - (-6)(1 - 2)}{(6)^2}
            = \frac{-6 - 6}{36} = -\frac{1}{3} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Quotient Rule with $\dydx$ terms
          - points: 1
            criterion: Substitutes $\dydx = -1$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.2
          - 3.6
        dok: 3
        work_space: 2.5in
    calculator_active: false
    question_type: FRQ
    review: generated

  - id: b4f421e3-5f4d-418d-9a9b-7b8163c83755
    question: |
      Let $f$ and $g$ be differentiable functions. The function $g$ is strictly
      increasing. Selected values of $f$, $g$, and their derivatives are given in
      the table above.
    figure: 41.tex
    figure_placement: above
    parts:
      - question: |
          If $h(x) = \sqrt{f(x)}$, find $h'(2)$.
        solution: |
          \begin{gather*}
            h'(x) = \frac{1}{2} \left[ f(x) \right]^{-1/2} \cdot f'(x) = \frac{f'(x)}{2\sqrt{f(x)}} \\
            h'(2) = \frac{f'(2)}{2\sqrt{f(2)}} = \frac{6}{2\sqrt{9}} = \frac{6}{6} = 1 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
        dok: 2
        work_space: 1.5in
      - question: |
          If $k(x) = \tan^{-1}(g(x))$, find $k'(1)$.
        solution: |
          \begin{gather*}
            k'(x) = \frac{1}{1 + \left[ g(x) \right]^2} \cdot g'(x) \\
            k'(1) = \frac{g'(1)}{1 + \left[ g(1) \right]^2} = \frac{3}{1 + (1)^2} = \frac{3}{2} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Derivative of $\tan^{-1}$
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.4
        dok: 2
        work_space: 1.5in
      - question: |
          Find $(g^{-1})'(2)$.
        solution: |
          $(g^{-1})'(2) = \frac{1}{g'(g^{-1}(2))} = \frac{1}{g'(2)} = \frac{1}{\frac{1}{2}} = 2$
        grading:
          - points: 1
            criterion: Expression for $(g^{-1})'(2)$
          - points: 1
            criterion: Evaluated $g^{-1}(2)$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.3
        dok: 2
        work_space: 1.5in
      - question: |
          If $m(x) = f(2x) \cdot g(x)$, find $m'(1)$.
        solution: |
          \begin{gather*}
            m'(x) = f'(2x) \cdot 2 \cdot g(x) + f(2x) \cdot g'(x) \\
            m'(1) = 2 f'(2) g(1) + f(2) g'(1) \\
            = 2(6)(1) + (9)(3) = 12 + 27 = 39 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Product Rule
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.5
        dok: 2
        work_space: 2in
    calculator_active: false
    question_type: FRQ
    review: generated
