  - id: f8b3f5a9-7812-4d4f-ae63-dfbf1de47af0
    question: |
      Let $f$ be the function defined by $f(x) = 2x + \sin x$. The function $f$ is
      increasing for all $x$, and $g$ is the inverse function of $f$.
    parts:
      - question: |
          Find the value of $g(3)$.
        solution: |
          \begin{gather*}
            g(3) = x \text{ where } f(x) = 3 \\
            2x + \sin x = 3 \\
            g(3) \approx 1.0631 \qquad \text{(solve with calculator)} \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Sets $f(x) = 3$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.3
        dok: 2
        work_space: 1.5in
      - question: |
          Find the value of $g'(3)$.
        solution: |
          \begin{gather*}
            f'(x) = 2 + \cos x \\
            g'(3) = \frac{1}{f'(g(3))} = \frac{1}{2 + \cos(1.0631)} \approx 0.4022 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Expression for $g'(3)$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.3
        dok: 2
        work_space: 1.5in
      - question: |
          Let $p$ be the function defined by $p(x) = f\left(\tan^{-1} x\right)$. Find
          $p'(1)$.
        solution: |
          \begin{gather*}
            p'(x) = f'\left(\tan^{-1} x\right) \cdot \frac{1}{1 + x^2}
            = \frac{2 + \cos\left(\tan^{-1} x\right)}{1 + x^2} \\
            p'(1) = \frac{2 + \cos\left(\frac{\pi}{4}\right)}{2} = 1 + \frac{\sqrt{2}}{4} \approx 1.3536 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Derivative of $\tan^{-1}$
          - points: 1
            criterion: Use of Chain Rule
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.4
        dok: 2
        work_space: 1.5in
      - question: |
          Find the value of $g''(3)$.
        solution: |
          \begin{gather*}
            g'(x) = \frac{1}{2 + \cos(g(x))} = \left[ 2 + \cos(g(x)) \right]^{-1} \\
            g''(x) = -\left[ 2 + \cos(g(x)) \right]^{-2} \cdot \left( -\sin(g(x)) \cdot g'(x) \right)
            = \frac{\sin(g(x)) \cdot g'(x)}{\left[ 2 + \cos(g(x)) \right]^2} \\
            g''(3) = \frac{\sin(1.0631) \cdot 0.4022}{\left[ 2 + \cos(1.0631) \right]^2} \approx 0.0569 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: Use of Chain Rule on $g'(x)$
          - points: 1
            criterion: Expression for $g''(x)$
          - points: 1
            criterion: Correct answer
        sections:
          - 3.1
          - 3.3
          - 3.6
        dok: 3
        work_space: 2.5in
    calculator_active: true
    question_type: FRQ
    review: generated
