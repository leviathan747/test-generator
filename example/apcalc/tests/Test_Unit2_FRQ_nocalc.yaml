  Read all directions and answer each question completely. Unless otherwise
  specified, all answers will be real numbers.
question_count: 2
questions:
  - id: 37874785-f22f-4bcc-b741-409e92820354
    legacy_ids:
      - 2.A.11
    question: |
      Consider the function $f(x) = x^2 - x - 11$
    parts:
      - question: |
          Find the average rate of change of $f(x)$ on $[0, 6]$.
        solution: |
          $\frac{f(6) - f(0)}{6 - 0}$
          $= \frac{(6)^2 - 6 - 11 - \left[(0)^2 - 0 - 11 \right]}{6}$
          $= \frac{30}{6} = 5$
        grading:
          - points: 1
            criterion: Difference quotient
          - points: 1
            criterion: Answer
        sections:
          - 2.1
        work_space: 1.5in
      - question: |
          Find the instantaneous rate of change of $f(x)$ when $x = 4$.
        solution: |
          $f'(x) = 2x - 1$

          $f'(4) = 2(4) - 1 = 7$
        grading:
          - points: 1
            criterion: Derivative
          - points: 1
            criterion: Answer
        sections:
          - 2.1
          - 2.2
          - 2.5
          - 2.6
        work_space: 1.5in
      - question: |
          Write an equation for the line tangent to $f(x)$ at the point where $x = 4$.
        solution: |
          $f(4) = (4)^2 - 4 - 11 = 1$

          $y = 7(x - 4) + 1$
        grading:
          - points: 1
            criterion: $f(4)$
          - points: 1
            criterion: Answer
        sections:
          - 2.2
        work_space: 1.5in
      - question: |
          If $g(x) = \frac{f(x)}{e^x}$, find all values of $x$ where $g$ has a
          horizontal tangent line. Justify your answer.
        solution: |
          $g'(x) = \frac{e^x \cdot f'(x) - f(x) \cdot e^x}{\left(e^x\right)^2}$
          $= \frac{e^x \left[ f'(x) - f(x) \right]}{e^{2x}}$
          $= \frac{f'(x) - f(x)}{e^x}$

          Horizontal tangent lines occur when $g'(x) = 0 \Rightarrow f'(x) = f(x)$
          \begin{gather*}
            x^2 - x - 11 = 2x - 1 \\
            x^2 - 3x - 10 = 0 \\
            (x - 5)(x + 2) = 0 \\
            x = -2, 5 \\
          \end{gather*}
        grading:
          - points: 1
            criterion: $g'(x)$
          - points: 1
            criterion: $g'(x) = 0$
          - points: 1
            criterion: Answer
        sections:
          - 2.2
          - 2.7
          - 2.9
        work_space: 2.5in
    calculator_active: false
    question_type: FRQ

  - id: 71949a2c-e791-4635-b410-7ff9b57f3641
    legacy_ids:
      - 2.B.11
    question: |
      The graphs of the function $f$ and its derivative $f'$ are shown above for $-1 \le x \le 4$.
    figure: 35.tex
    figure_placement: above
    parts:
      - question: |
          Find the average rate of change of $f$ over the interval $-1 \le x \le
          4$. For how many values of $x$ in the interval $-1 \le x \le 4$ does
          the instantaneous rate of change of $f$ equal the average rate of
          change of $f$ over that interval?
        solution: |
          $\frac{f(4) - f(-1)}{4 - (-1)} = \frac{1 - (-2)}{5} = \frac{3}{5}$

          The instantaneous rate of change of $f$ is equal to the average rate
          of change over the interval $-1 \le x \le 4$ exactly 2 times because
          the graph of $f'$ intersects with the constant function $\textstyle y =
          \frac{3}{5}$ two times in that interval.
        grading:
          - points: 1
            criterion: Average rate of change
          - points: 1
            criterion: Answer with explanation
        sections:
          - 2.1
        work_space: 2in
      - question: |
          Write an equation for the line tangent to the graph of $f$ at $x = 1$.
        solution: |
          $y = f(1) + f'(1)(x - 1) \implies y = 2 + -2(x - 1)$
        grading:
          - points: 0.5
            criterion: $f(1)$
          - points: 0.5
            criterion: $f'(1)$
          - points: 1
            criterion: Correct equation
        sections:
          - 2.2
        work_space: 1.5in
      - question: |
          For each of $\lim_{x \to 2} \frac{f(x) - f(2)}{x - 2}$ and $\lim_{x \to
          3} \frac{f(x) - f(3)}{x - 3}$, find the value or give a reason why it
          does not exist.
        solution: |
          $\lim_{x \to 2} \frac{f(x) - f(2)}{x - 2} = f'(2) = 1$

          $\lim_{x \to 3} \frac{f(x) - f(3)}{x - 3} = f'(3) = \text{undefined}$

          The second limit does not exist because it is equal to the value $f'$
          at $x = 3$ (definition of the derivative) and $f'(3)$ is undefined.
        grading:
          - points: 1
            criterion: First limit
          - points: 1
            criterion: Second limit
          - points: 1
            criterion: Explanation
        sections:
          - 2.2
        work_space: 2in
      - question: |
          Let $g$ be the function defined by $g(x) = (e^x) \cdot f(x)$. Find $g'(0)$.
        solution: |
          $g'(x) = e^x \cdot f'(x) + e^x \cdot f(x) = e^x (f'(x) + f(x))$

          $g'(0) = 1 \cdot (1 + 3) = 4$
        grading:
          - points: 1
            criterion: $g'(x)$
          - points: 1
            criterion: Correct answer
        sections:
          - 2.7
          - 2.8
        work_space: 1.5in
    calculator_active: false
    question_type: FRQ
    review: check
