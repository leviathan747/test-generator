    question: |
      To find the derivative of $\cot x$, a student writes
      $\cot x = \frac{\cos x}{\sin x}$ and applies the quotient rule. Which of
      the following is the correct result of applying the quotient rule, before
      simplifying?
    answer: $\frac{\sin x(-\sin x) - \cos x(\cos x)}{\sin^2 x}$
    distractors:
