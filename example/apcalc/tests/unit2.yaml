    question: |
      For what value(s) of $a$ will the function $g(x) = a \sqrt x + 4x$ have a
      tangent line whose slope is 3 when $x = 4$
    answer: $a = -4$
    distractors:
      - $a = -5$
      - $a = -\frac{1}{4}$
      - $a = -6$
    solution: |
      $g'(x) = \frac{a}{2 \sqrt x} + 4$

      $g'(4) = 3 \Rightarrow$
      $\frac{a}{2 \sqrt 4} + 4 = 3 \Rightarrow$
      $\frac{a}{2 \sqrt 4} = -1 \Rightarrow$
      $a = -1 \cdot 2 \sqrt 4 \Rightarrow$
      $a = -4$
