    solution: |
      $\frac{d}{dx}\left[ \frac{\cos x}{\sin x} \right] = \frac{\sin x(-\sin x) - \cos x(\cos x)}{\sin^2 x}$ \quad (Quotient Rule)

      $= \frac{-(\sin^2 x + \cos^2 x)}{\sin^2 x} = -\frac{1}{\sin^2 x} = -\csc^2 x$
