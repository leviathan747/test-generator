    question: |
      The derivative of a function $f$ is given by $f'(x) = \sin x$. On the
      open interval $(0, 2\pi)$, on what interval is $f$ increasing and the
      graph of $f$ concave down?
    answer: $\frac{\pi}{2} < x < \pi$
    distractors:
      - $0 < x < \frac{\pi}{2}$
      - $\pi < x < \frac{3\pi}{2}$
