    solution: |
      $f'$ increasing on $(1, 3)$ means the graph of $f$ is concave up there;
      $f'$ decreasing on $(3, 5)$ means the graph of $f$ is concave down there.
      The concavity changes at $x = 3$, so the graph of $f$ has a point of
      inflection at $x = 3$. Nothing is known about the sign of $f'(3)$.
