    question: |
      Let $f$ be a differentiable function. The graph of $f'$ is increasing on
      $1 < x < 3$ and decreasing on $3 < x < 5$. Which of the following must be
      true?
    answer: The graph of $f$ has a point of inflection at $x = 3$.
    distractors:
      - $f$ has a relative maximum at $x = 3$.
      - $f$ has a relative minimum at $x = 3$.
