  - id: f7cd16b3-bf54-4d58-8f0c-65231d016b85
    question: |
      At which points on the curve $y^3 - 3y = x$ is the tangent line
      vertical?
    answer: $(-2, 1)$ and $(2, -1)$
    distractors:
      - $(-2, -1)$ and $(2, 1)$
      - $(0, 0)$ only
      - $(0, \sqrt{3})$ and $(0, -\sqrt{3})$
    solution: |
      \begin{gather*}
        3y^2\dydx - 3\dydx = 1 \implies \dydx = \frac{1}{3y^2 - 3}
      \end{gather*}
      The tangent line is vertical where $3y^2 - 3 = 0$, so $y = \pm 1$.
      $y = 1$ gives $x = 1 - 3 = -2$, and $y = -1$ gives $x = -1 + 3 = 2$.
