  - id: 7e0d9164-1b39-4e2e-812a-263b9ffeef5f
    question: |
      What point on the line $y = 2x + 1$ is closest to the origin?
    answer: $\left(-\frac{2}{5}, \frac{1}{5}\right)$
    distractors:
      - $(0, 1)$
      - $\left(-\frac{1}{2}, 0\right)$
      - $\left(\frac{2}{5}, \frac{9}{5}\right)$
    solution: |
      Minimize the square of the distance:
      \begin{gather*}
        D(x) = x^2 + (2x + 1)^2 = 5x^2 + 4x + 1 \\
        D'(x) = 10x + 4 = 0 \implies x = -\frac{2}{5} \\
        D''(x) = 10 > 0 \implies \text{minimum} \\
        y = 2\left(-\frac{2}{5}\right) + 1 = \frac{1}{5}
      \end{gather*}
