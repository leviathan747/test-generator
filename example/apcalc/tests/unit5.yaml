    question: |
      At which points on the curve $x^2 + y^2 = 25$ is the tangent line
      horizontal?
    answer: $(0, 5)$ and $(0, -5)$
    distractors:
      - $(5, 0)$ and $(-5, 0)$
      - $(0, 5)$ only
      - $(3, 4)$ and $(-3, -4)$
    solution: |
      \begin{gather*}
        2x + 2y\dydx = 0 \implies \dydx = -\frac{x}{y} \\
        \dydx = 0 \implies x = 0 \implies y^2 = 25 \implies y = \pm 5
      \end{gather*}
