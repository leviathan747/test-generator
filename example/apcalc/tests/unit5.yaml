  - id: 469de7b9-7be1-430d-93b2-5ca829d40334
    question: |
      For the curve $x^2 + y^2 = 25$, what is the value of
      $\frac{d^2y}{dx^2}$ at the point $(3, 4)$?
    answer: $-\frac{25}{64}$
    distractors:
      - $-\frac{3}{4}$
      - $\frac{25}{64}$
      - $-\frac{7}{64}$
    solution: |
      \begin{gather*}
        \dydx = -\frac{x}{y} \\
        \frac{d^2y}{dx^2} = -\frac{y - x\dydx}{y^2}
        = -\frac{y + \frac{x^2}{y}}{y^2} = -\frac{x^2 + y^2}{y^3} = -\frac{25}{y^3} \\
        \frac{d^2y}{dx^2}\bigg|_{(3, 4)} = -\frac{25}{64}
      \end{gather*}
    calculator_active: false
