  - id: ce2092d4-4091-4c5a-a60f-8f5dafa3069c
    question: |
      A farmer has 600 feet of fencing to enclose a rectangular field that
      borders a straight river. No fencing is needed along the river. What is
      the largest area, in square feet, that the farmer can enclose?
    answer: 45,000
    distractors:
      - 22,500
      - 90,000
      - 40,000
    solution: |
      Let $x$ be the length of each side perpendicular to the river, so the
      side parallel to the river is $600 - 2x$.
      \begin{gather*}
        A(x) = x(600 - 2x) = 600x - 2x^2 \\
        A'(x) = 600 - 4x = 0 \implies x = 150 \\
        A''(x) = -4 < 0 \implies \text{maximum} \\
        A(150) = 150 \cdot 300 = 45{,}000 \text{ square feet}
      \end{gather*}
