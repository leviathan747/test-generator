  - id: 16c28c29-4d9e-4a31-8ec6-48682b1f11c2
    question: |
      A rectangle has an area of 64 square units. What is the minimum possible
      perimeter of the rectangle?
    answer: 32
    distractors:
      - 16
      - 40
      - 64
    solution: |
      \begin{gather*}
        P(x) = 2x + 2 \cdot \frac{64}{x} = 2x + \frac{128}{x} \quad (x > 0) \\
        P'(x) = 2 - \frac{128}{x^2} = 0 \implies x = 8 \\
        P''(x) = \frac{256}{x^3} > 0 \implies \text{minimum} \\
        P(8) = 16 + 16 = 32
      \end{gather*}
