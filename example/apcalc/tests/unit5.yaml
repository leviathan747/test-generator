  - id: 58f07e86-27f4-4249-aec2-1f5b10d8cec2
    question: |
      An open-top box is made from a 12-inch by 12-inch square sheet of
      cardboard by cutting a square of side $x$ inches from each corner and
      folding up the sides. What value of $x$ maximizes the volume of the box?
    answer: 2
    distractors:
      - 3
      - 4
      - 6
    solution: |
      \begin{gather*}
        V(x) = x(12 - 2x)^2, \quad 0 < x < 6 \\
        V'(x) = (12 - 2x)^2 - 4x(12 - 2x) = (12 - 2x)(12 - 6x) = 0
        \implies x = 2 \quad (x = 6 \text{ is not in the domain})
      \end{gather*}
      $V'(x) > 0$ for $0 < x < 2$ and $V'(x) < 0$ for $2 < x < 6$, so the
      volume is a maximum when $x = 2$.
