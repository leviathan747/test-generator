  - id: a0630c5e-b60e-4eb3-9fa8-92feaea33753
    question: |
      At which points on the curve $x^2 + xy + y^2 = 12$ is the tangent line
      horizontal?
    answer: $(2, -4)$ and $(-2, 4)$
    distractors:
      - $(-4, 2)$ and $(4, -2)$
      - $(2, 4)$ and $(-2, -4)$
      - $(0, 2\sqrt{3})$ and $(0, -2\sqrt{3})$
    solution: |
      \begin{gather*}
        2x + y + x\dydx + 2y\dydx = 0 \implies \dydx = -\frac{2x + y}{x + 2y} \\
        \dydx = 0 \implies y = -2x \\
        x^2 + x(-2x) + (-2x)^2 = 3x^2 = 12 \implies x = \pm 2
      \end{gather*}
      The points are $(2, -4)$ and $(-2, 4)$; at both, $x + 2y \ne 0$.
    calculator_active: false
    sections:
      - 5.12
    dok: 2
