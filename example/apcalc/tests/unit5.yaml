    question: |
      Two positive numbers have a sum of 20. What is the maximum possible value
      of their product?
    answer: 100
    distractors:
      - 96
      - 75
      - 200
    solution: |
      \begin{gather*}
        P(x) = x(20 - x) = 20x - x^2 \\
        P'(x) = 20 - 2x = 0 \implies x = 10 \\
        P''(x) = -2 < 0 \implies \text{maximum} \\
        P(10) = 10 \cdot 10 = 100
      \end{gather*}
