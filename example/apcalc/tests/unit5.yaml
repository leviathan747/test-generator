    question: |
      A rectangle has its base on the $x$-axis and its upper two vertices on
      the parabola $y = 12 - x^2$. What is the largest possible area of the
      rectangle?
    answer: 32
    distractors:
      - 16
      - 24
      - 48
    solution: |
      Let the upper vertices be $(\pm x, 12 - x^2)$ with $0 < x < 2\sqrt{3}$.
      \begin{gather*}
        A(x) = 2x(12 - x^2) = 24x - 2x^3 \\
        A'(x) = 24 - 6x^2 = 0 \implies x = 2 \\
        A''(x) = -12x < 0 \implies \text{maximum} \\
        A(2) = 2(2)(12 - 4) = 32
      \end{gather*}
