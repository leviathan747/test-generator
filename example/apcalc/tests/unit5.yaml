      \textbf{I.} False: $f$ could be differentiable at $c$ (e.g. $f(x) = x^2$),
      so it is not required that $f'(c)$ fail to exist. \\
      \textbf{II.} True: if $f'(c)$ exists at a relative minimum, then $f'(c) = 0$. \\
      \textbf{III.} False: at a relative minimum the graph is concave up, so
      $f''(c) \ge 0$, not $f''(c) < 0$.
