      What are all values of $x$ for which the function $f$ defined by
      $f(x) = x^3 + 3x^2 - 9x + 7$ is increasing?
    answer: $x < -3$ or $x > 1$
    distractors:
      - $-3 < x < 1$
      - $x < -1$ or $x > 3$
      - $-1 < x < 1$
    solution: |
      \begin{gather*}
        f'(x) = 3x^2 + 6x - 9 = 3(x + 3)(x - 1)
      \end{gather*}
      \sgchart{-3,1}{f'(x): +-+}
      $f$ is increasing where $f'(x) > 0$: $x < -3$ or $x > 1$.
    calculator_active: false
