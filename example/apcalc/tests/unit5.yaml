      If $f$ is continuous on the closed interval $[a, b]$ and differentiable on the open interval $(a, b)$, which of the following
      \emph{must} be true?
    answer: There is a number $c$ in the closed interval $[a, b]$ such that $f'(c)=\frac{f(b)-f(a)}{b-a}$.
