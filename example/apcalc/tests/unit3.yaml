    question: |
      If the slope of a strictly monotonic function $f$, is $\frac{3}{4}$ at a particular
      point $(b, a)$, what is the slope of $f^{-1}$ at the point $(a, b)$?
    answer: $\frac{4}{3}$
    distractors:
      - $\frac{3}{4}$
      - $-\frac{3}{4}$
      - $-\frac{4}{3}$
    solution: |
      The slope of $f^{-1}$ at the point $(a, b)$ is $(f^{-1})'(a)$ \\
      $(f^{-1})'(a) = \frac{1}{f'(f^{-1}(a))}$ \\
      $f^{-1}(a) = b$ \\
      $f'(b) = \frac{3}{4}$ \\
      $(f^{-1})'(a) = \frac{1}{\frac{3}{4}} = \frac{4}{3}$
    calculator_active: true
