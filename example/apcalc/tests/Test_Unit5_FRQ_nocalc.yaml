  - id: 784e067d-53f2-4e43-aebc-4fb11dd2e583
    question: |
      Let $f$ be the function defined by $f(x) = x^3 - 6x^2 + 9x + 1$ on the
      closed interval $-1 \le x \le 5$.
    parts:
      - question: |
          On what interval(s) is $f$ increasing? Justify your answer.
        solution: |
          \begin{gather*}
            f'(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3) = 0 \implies x = 1, 3
          \end{gather*}
          \[
          \tabskip0pt\openup 3pt
          \vbox{\halign{#&&\hbox to 0.8in{\cleaders\hbox{#}\hfill}&\hbox to 0pt{\hss$#$\hss}\cr
          $f'(x)$ & + & 0 & $ - $ & 0 & + \cr
          &---&\vert&---&\vert&---&\cr
          &&1&&3\cr}}
          \]
          $f$ is increasing on $[-1, 1]$ and $[3, 5]$ because $f'(x) > 0$ on
          $(-1, 1)$ and $(3, 5)$.
        grading:
          - points: 1
            criterion: $f'(x)$ and critical numbers
          - points: 1
            criterion: Correct intervals with justification
        sections:
          - 5.3
        dok: 2
        work_space: 2in
      - question: |
          Find the absolute maximum value and the absolute minimum value of $f$ on
          the interval $-1 \le x \le 5$. Justify your answer.
        solution: |
          Candidates: the critical numbers $x = 1, 3$ and the endpoints $x = -1, 5$.

          \begin{tabularx}{3in}{ Y*{4}{|Y} }
            \bm{$x$} & -1 & 1 & 3 & 5 \\
            \hline
            \bm{$f(x)$} & -15 & 5 & 1 & 21 \\
          \end{tabularx}

          Absolute maximum value is $21$ (at $x = 5$). \\
          Absolute minimum value is $-15$ (at $x = -1$).
        grading:
          - points: 1
            criterion: Considers critical numbers and endpoints
          - points: 1
            criterion: Absolute maximum value
          - points: 1
            criterion: Absolute minimum value
        sections:
          - 5.5
        dok: 2
        work_space: 2.5in
      - question: |
          Find the $x$-coordinate of each point of inflection of the graph of $f$.
          Justify your answer.
        solution: |
          \begin{gather*}
            f''(x) = 6x - 12 = 6(x - 2) = 0 \implies x = 2
          \end{gather*}
          P.O.I. at $x = 2$ because $f''(x)$ changes sign at $x = 2$.
        grading:
          - points: 1
            criterion: Correct point of inflection
          - points: 1
            criterion: Justification
        sections:
          - 5.6
        dok: 2
        work_space: 1.5in
      - question: |
          Explain why there must be a value $c$, for $0 < c < 3$, such that
          $f'(c) = 0$. Find the value of $c$.
        solution: |
          $f$ is a polynomial, so it is continuous on $[0, 3]$ and differentiable
          on $(0, 3)$.
          \begin{gather*}
            f(0) = 1 \qquad f(3) = 27 - 54 + 27 + 1 = 1
          \end{gather*}
          Since $f(0) = f(3)$, by Rolle's Theorem there is a value $c$ in $(0, 3)$
          such that $f'(c) = 0$.
          \begin{gather*}
            3(c - 1)(c - 3) = 0 \implies c = 1
          \end{gather*}
        grading:
          - points: 1
            criterion: Continuity, differentiability, and $f(0) = f(3)$
          - points: 1
            criterion: Correct value of $c$
        sections:
          - 5.1
        dok: 3
        work_space: 2in
    calculator_active: false
    question_type: FRQ
    review: generated

  - id: 4e0d4738-3486-4f2f-be7e-6fa203e644c5
    question: |
      Consider the curve given by $y^2 = x^3 - 3x + 3$.
    parts:
      - question: |
          Show that $\dydx = \frac{3x^2 - 3}{2y}$.
        solution: |
          \begin{gather*}
            2y \dydx = 3x^2 - 3 \\
            \dydx = \frac{3x^2 - 3}{2y}
          \end{gather*}
        grading:
          - points: 1
            criterion: Implicit differentiation
        sections:
          - 5.12
        dok: 1
        work_space: 1in
      - question: |
          Find the coordinates of each point on the curve at which the line tangent
          to the curve is horizontal.
        solution: |
          Horizontal tangent lines occur where $\textstyle \dydx = 0 \implies 3x^2 - 3 = 0 \implies x = \pm 1$ \\
          Substitute into the equation of the curve:
          \begin{gather*}
            x = 1: \quad y^2 = 1 - 3 + 3 = 1 \implies y = \pm 1 \\
            x = -1: \quad y^2 = -1 + 3 + 3 = 5 \implies y = \pm \sqrt{5}
          \end{gather*}
          The points are $(1, 1)$, $(1, -1)$, $(-1, \sqrt{5})$, and $(-1, -\sqrt{5})$.
          At each point $y \ne 0$.
        grading:
          - points: 1
            criterion: Sets num. equal to 0
          - points: 1
            criterion: All four points
        sections:
          - 5.12
        dok: 2
        work_space: 2in
      - question: |
          Find $\frac{d^2y}{dx^2}$ in terms of $x$, $y$, and $\dydx$.
        solution: |
          \begin{gather*}
            \frac{d^2y}{dx^2} = \frac{2y \cdot 6x - (3x^2 - 3) \cdot 2 \dydx}{(2y)^2}
            = \frac{6xy - (3x^2 - 3) \dydx}{2y^2}
          \end{gather*}
        grading:
          - points: 1
            criterion: Quotient Rule with $\dydx$ term
          - points: 1
            criterion: Correct answer
        sections:
          - 5.12
        dok: 2
        work_space: 2in
      - question: |
          The curve has horizontal tangent lines at the points $(1, 1)$ and
          $(-1, \sqrt{5})$. For each point, determine whether the curve has a
          relative minimum, a relative maximum, or neither at that point. Justify
          your answer.
        solution: |
          At both points $\dydx = 0$, so $\frac{d^2y}{dx^2} = \frac{6xy}{2y^2} = \frac{3x}{y}$.
          \begin{gather*}
            \left. \frac{d^2y}{dx^2} \right|_{(1, 1)} = \frac{3(1)}{1} = 3 > 0
            \implies \text{relative minimum} \\
            \left. \frac{d^2y}{dx^2} \right|_{(-1, \sqrt{5})} = \frac{3(-1)}{\sqrt{5}} = -\frac{3}{\sqrt{5}} < 0
            \implies \text{relative maximum}
          \end{gather*}
          By the Second Derivative Test, the curve has a relative minimum at $(1, 1)$
          and a relative maximum at $(-1, \sqrt{5})$.
        grading:
          - points: 1
            criterion: Evaluates $\frac{d^2y}{dx^2}$ at both points
          - points: 1
            criterion: Relative minimum at $(1, 1)$ with justification
          - points: 1
            criterion: Relative maximum at $(-1, \sqrt{5})$ with justification
        sections:
          - 5.7
          - 5.12
        dok: 3
        work_space: 2.5in
    calculator_active: false
    question_type: FRQ
    review: generated
