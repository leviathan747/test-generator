[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-generator"
version = "0.2.0"
description = "Generate test and quiz PDFs from YAML question banks via LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "Levi", email = "levi@roxsoftware.com" } ]
keywords = ["tests", "generator", "pytest"]
dependencies = [
    "jsonschema>=4.18",
    "pyyaml",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
test_generator = ["schemas/*.json"]
